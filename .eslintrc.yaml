env:
  node: true
  es2020: true

parser: "@typescript-eslint/parser"
parserOptions:
  ecmaVersion: 2020
  sourceType: module
  project: ./tsconfig.eslint.json

extends:
  - eslint:recommended
  - plugin:@typescript-eslint/recommended
  - prettier

plugins:
  - "@typescript-eslint"

rules:
  "@typescript-eslint/no-explicit-any": warn
  "@typescript-eslint/no-unused-vars":
    - error
    - argsIgnorePattern: "^_"
  no-console: warn

ignorePatterns:
  - node_modules/
  - artifacts/
  - cache/
  - types/
  - coverage/
  - "*.js"
  - "!*.config.js"
