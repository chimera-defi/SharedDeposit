# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      run: npm ci --legacy-peer-deps
    - name: Run prettier check
      run: npm run prettier:check
    - name: Run Solidity linting
      run: npm run lint:sol
      continue-on-error: true
    - name: Run TypeScript linting
      run: npm run lint:ts
    - name: Compile contracts
      run: npm run compile
    - name: Run tests
      run: npm run test
    - name: Generate coverage
      run: npm run coverage
      continue-on-error: true

  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci --legacy-peer-deps
    
    - name: Compile contracts
      run: npm run compile
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Slither
      run: pip3 install slither-analyzer
    
    - name: Run Slither
      run: |
        slither . \
          --ignore-compile \
          --compile-force-framework hardhat \
          --solc-remaps @openzeppelin/=$(pwd)/node_modules/@openzeppelin/ \
          --exclude-dependencies \
          --exclude-informational \
          --exclude-optimization \
          --json slither-report.json || true
      continue-on-error: true
    
    - name: Upload Slither report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: slither-report
        path: slither-report.json
        retention-days: 30
    
    - name: Install Semgrep
      run: pip3 install semgrep
    
    - name: Run Semgrep
      run: |
        semgrep --config=auto --json --output semgrep-report.json contracts/ || true
      continue-on-error: true
    
    - name: Upload Semgrep report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: semgrep-report
        path: semgrep-report.json
        retention-days: 30
    
    - name: Run npm audit
      run: npm audit --audit-level=high
      continue-on-error: true
